name: Release

# Manual only: run from the Actions tab (or `gh workflow run Release -f version=0.6.0`).
# Tags main's current HEAD, builds the APK (version is derived from the tag),
# and publishes a GitHub release with notes from the commits since the last tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must look like X.Y.Z"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Guard against an existing tag
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "tag v${{ inputs.version }} already exists"; exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Tag main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Lumen ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "lumen_player_v${{ inputs.version }}.apk"

      - name: Release notes
        run: |
          PREV="$(git describe --tags --abbrev=0 "v${{ inputs.version }}^" 2>/dev/null || true)"
          {
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"; echo
              git log "${PREV}..v${{ inputs.version }}" --no-merges --pretty='- %s' \
                | grep -vE '^- (Bump version|chore: bump)' || true
            else
              echo "Initial release."
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Lumen ${{ inputs.version }}"
          body_path: NOTES.md
          files: "lumen_player_v${{ inputs.version }}.apk"

      - name: Signing note
        run: |
          echo "::notice::APK is debug-signed with an ephemeral key. Until a stable"
          echo "::notice::keystore is wired in, the in-app updater cannot install this"
          echo "::notice::release over a differently-signed build."
