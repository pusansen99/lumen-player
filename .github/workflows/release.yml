name: Release

# Manual only: run from the Actions tab (or `gh workflow run Release`).
# Leave "version" blank to auto-bump the last tag (patch by default); or give an
# exact version. Tags main's HEAD, builds a signed APK (version derived from the
# tag) and publishes a GitHub release with notes since the previous tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version, e.g. 1.0.0 (leave blank to bump the last tag)"
        required: false
        type: string
      bump:
        description: "Which part to bump when version is blank"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve version
        id: ver
        run: |
          IN='${{ inputs.version }}'
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$IN" ]; then
            V="${IN#v}"
          elif [ -z "$PREV" ]; then
            V="0.1.0"
          else
            IFS=. read -r MA MI PA <<<"${PREV#v}"
            case "${{ inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            V="${MA}.${MI}.${PA}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::bad version '$V'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV"  >> "$GITHUB_OUTPUT"
          echo "Releasing v$V (previous: ${PREV:-none})"

      - name: Guard against an existing tag
        run: |
          git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1 \
            && { echo "::error::tag v${{ steps.ver.outputs.version }} already exists"; exit 1; } || true

      - name: Require new commits since the last tag
        run: |
          PREV='${{ steps.ver.outputs.prev }}'
          [ -z "$PREV" ] && { echo "first release, proceeding"; exit 0; }
          N="$(git rev-list "${PREV}..HEAD" --count)"
          echo "$N commit(s) on main since ${PREV}"
          [ "$N" -gt 0 ] || { echo "::error::main has no new commits since ${PREV}; nothing to release."; exit 1; }

      - name: Require signing secret
        run: |
          [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ] \
            || { echo "::error::SIGNING_KEYSTORE_B64 is not set"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tag main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "Lumen ${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "lumen_player_v${{ steps.ver.outputs.version }}.apk"

      - name: Release notes
        run: |
          PREV='${{ steps.ver.outputs.prev }}'
          {
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"; echo
              git log "${PREV}..HEAD" --no-merges --pretty='- %s' \
                | grep -vE '^- (Bump version|chore: bump)' || true
            else
              echo "Initial release."
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "Lumen ${{ steps.ver.outputs.version }}"
          body_path: NOTES.md
          files: "lumen_player_v${{ steps.ver.outputs.version }}.apk"
