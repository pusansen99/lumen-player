name: Release

# Manual only: run from the Actions tab (or `gh workflow run Release -f version=0.6.0`).
# Tags main's current HEAD, builds a signed APK (version is derived from the tag),
# and publishes a GitHub release with notes from the commits since the last tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must look like X.Y.Z"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Guard against an existing tag
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "tag v${{ inputs.version }} already exists"; exit 1
          fi

      - name: Require new commits since the last tag
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "No previous tag — first release, proceeding."
            exit 0
          fi
          N="$(git rev-list "${PREV}..HEAD" --count)"
          echo "$N commit(s) on main since ${PREV}"
          if [ "$N" -eq 0 ]; then
            echo "::error::main has no new commits since ${PREV}; nothing to release."
            exit 1
          fi

      - name: Require signing secret
        run: |
          [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ] \
            || { echo "::error::SIGNING_KEYSTORE_B64 is not set"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tag main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Lumen ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/release/app-release.apk "lumen_player_v${{ inputs.version }}.apk"

      - name: Release notes
        run: |
          PREV="$(git describe --tags --abbrev=0 "v${{ inputs.version }}^" 2>/dev/null || true)"
          {
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"; echo
              git log "${PREV}..v${{ inputs.version }}" --no-merges --pretty='- %s' \
                | grep -vE '^- (Bump version|chore: bump)' || true
            else
              echo "Initial release."
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Lumen ${{ inputs.version }}"
          body_path: NOTES.md
          files: "lumen_player_v${{ inputs.version }}.apk"
