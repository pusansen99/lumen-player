name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write        # mikepenz/action-junit-report posts a check run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tags are needed for the git-derived version

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble + test + lint
        # assembleRelease runs R8 + resource shrinking, so a shrink regression fails a PR.
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace

      - name: APK sizes
        run: |
          for v in debug release; do
            f="app/build/outputs/apk/$v/app-$v.apk"
            [ -f "$f" ] && printf '%s\t%s\n' "$v" "$(du -h "$f" | cut -f1)"
          done

      - name: Report version
        run: echo "versionName from git = $(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0)"

      - name: Publish unit test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'app/build/test-results/testDebugUnitTest/**/*.xml'
          check_name: unit tests
          fail_on_failure: true

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
