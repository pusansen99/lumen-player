name: Dependency submission

# Reports the Gradle dependency graph to GitHub so Dependabot security
# alerts and the dependency graph are accurate (Gradle deps are not
# auto-detected otherwise).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/dependency-submission@v6
        env:
          # Only report what the app actually ships — not the Gradle plugin
          # classpath (Develocity's Netty, AGP tooling, etc.).
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: "^(debug|release)RuntimeClasspath$"
          DEPENDENCY_GRAPH_INCLUDE_PROJECTS: "^:app$"
