<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;}
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap');
body{margin:0;font-family:'Manrope',system-ui,-apple-system,sans-serif;background:#0B0B0D;color:#F5F5F7;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Sora','Manrope',system-ui,sans-serif;margin:0;}
.fld{display:flex;align-items:center;gap:10px;background:#0B0B0D;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:13px 14px;}
.btn{width:100%;text-align:center;padding:14px 0;border-radius:12px;font-size:14px;font-weight:700;font-family:'Sora',sans-serif;}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0B0B0D;">

  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);"></div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#151518;border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid rgba(255,255,255,0.08);padding:12px 20px 30px;display:flex;flex-direction:column;gap:16px;">

    <div style="width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,0.18);align-self:center;"></div>

    <h2 style="font-size:18px;font-weight:700;">Add video from URL</h2>

    <div class="fld">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span style="flex:1;font-size:13px;color:#F5F5F7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">https://cdn.example.com/live/nightdrive.m3u8</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>

    <div style="display:flex;gap:12px;align-items:center;background:#1E1E22;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;">
      <div style="width:72px;height:44px;border-radius:8px;background:radial-gradient(120% 100% at 60% 15%,#2a3746 0%,#141922 55%,#080a0e 85%);flex:0 0 auto;"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:600;">Night Drive (live)</div>
        <div style="font-size:11px;color:#A1A1AA;font-weight:600;margin-top:2px;">HLS stream detected &middot; up to 1080p</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4C8DFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-size:11px;color:#71717A;font-weight:600;">Title</span>
      <div class="fld" style="border-color:rgba(255,255,255,0.1);">
        <span style="flex:1;font-size:13px;color:#F5F5F7;">Night Drive (live)</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:2px;">
      <div class="btn" style="background:#4C8DFF;color:#08131f;">Play now</div>
      <div class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.16);color:#F5F5F7;">Save to library</div>
    </div>

    <div style="font-size:11px;color:#71717A;text-align:center;">Supports HLS, DASH, MP4 and WebM links</div>

  </div>

</div>
</x-dc>
</body>
</html>
